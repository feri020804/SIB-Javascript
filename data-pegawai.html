<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //  data pegawai
      let nama = "Dodi Prayodi";
      let umur = "25 Tahun";
      let jabatan = "Manajer";
      let status = "Menikah";

      let gapok = 0;
      if (jabatan === "Manajer") {
        gapok = 15000000;
      } else if (jabatan === "Asisten Manajer") {
        gapok = 10000000;
      } else if (jabatan === "Staff") {
        gapok = 5000000;
      }

      //   Perhitungan

      let tunjanganJabatan = 0.15 * gapok;
      let bpjs = 0.1 * gapok;
      let tunjanganKeluarga = status === "Menikah" ? 0.2 * gapok : 0;
      let totalGaji = gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;

      //   cetak tabel
      document.write("<h2>Data Pegawai</h2>");
      document.write("<table border='1' cellpadding='8' cellspacing='0'>");
      //   thead = judul tabel bercetak tebal
      document.write("<thead>");
      document.write("<tr>");
      document.write("<th>Nama Pegawai</th>");
      document.write("<th>Umur</th>");
      document.write("<th>Jabatan</th>");
      document.write("<th>Status</th>");
      document.write("<th>Gaji Pokok</th>");
      document.write("<th>Tunjungan Jabatan</th>");
      document.write("<th>BPJS</th>");
      document.write("<th>Tunjungan Keluarga</th>");
      document.write("</tr>");
      document.write("</thead>");

      //   tbody = isi tabel
      document.write("<tbody>");
      document.write("<tr>");
      document.write("<td>" + nama + "</td>");
      document.write("<td>" + umur + "</td>");
      document.write("<td>" + jabatan + "</td>");
      document.write("<td>" + status + "</td>");
      document.write("<td>" + gapok + "</td>");
      document.write("<td>" + tunjanganJabatan + "</td>");
      document.write("<td>" + bpjs + "</td>");
      document.write("<td>" + tunjanganKeluarga + "</td>");
      document.write("</tr>");
      document.write("</tbody>");

      //   tfoot = penutup tabel
      document.write("<tr>");
      document.write("<th colspan='8'> Total Gaji: Rp " + totalGaji + "</th>");
      document.write("</th>");

      document.write("</table>");
    </script>
  </body>
</html>
