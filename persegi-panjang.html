<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas1JS Feri Ardiansyah</title>

  <h2>Menghitung Luas bangun datar</h2>
  <script>
    //Menghitung Luas Persegi panjang
    // Rumus : Panjang x lebar
    let panjang = 10;
    let lebar = 20;
    // hasil
    document.write("Luas Persegi panjang = " + panjang * lebar);
    document.write("<br>");

    // Menghitung Luas Bujur sangkar
    // Rumus sisi x sisi
    let sisi = 10;
    // hasil
    document.write("Luas Bujur Sangkar = " + sisi * sisi);
    document.write("<br>");

    // Menghitung Luas Segitiga
    // rumus : 1/2 x alas x tinggi
    let statik = 0.5;
    let alas = 15;
    let tinggi = 20;
    // hasil
    document.write("Luas Segitiga = " + statik * alas * tinggi);
  </script>
  <body></body>
</html>
